name: "Testing"

on:
  workflow_dispatch:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions: {}

defaults:
  run:
    shell: pwsh

concurrency:
  group: "${{ github.workflow }}@${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dump pre-existing module state
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Check formatting
        shell: pwsh
        run: .\PSFoundation.ps1 format -Check

      - name: Lint
        shell: pwsh
        run: .\PSFoundation.ps1 lint

  test:
    name: Test
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dump pre-existing module state
        shell: pwsh
        run: |
          . .\src\maintenance.ps1
          Get-PSModule -Path ./.github/ci-modules-before.json

      - name: Initialize dependencies
        shell: pwsh
        run: .\PSFoundation.ps1 init

      - name: Dump post-init module state
        shell: pwsh
        run: |
          . .\src\maintenance.ps1
          Get-PSModule -Path ./.github/ci-modules-after.json

      - name: Format check
        shell: pwsh
        run: .\PSFoundation.ps1 format -Check

      - name: Lint
        shell: pwsh
        run: .\PSFoundation.ps1 lint

      - name: Test
        shell: pwsh
        run: .\PSFoundation.ps1 test

  dispatch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [test]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch a release workflow run
        # release only after every platform in the test matrix succeeded
        # ref: https://github.com/actions/runner/issues/1251
        if: ${{ github.event_name == 'push' && always() && !contains(join(needs.*.result, ','), 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: "${{ env.GITHUB_TOKEN }}"
          script: |
            const payload = {
              run_id: "${{ github.run_id }}",
              sha: "${{ github.sha }}"
            }

            console.log("Sending event payload", JSON.stringify(payload, null, 2));

            const { owner, repo } = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'release',
              client_payload: payload
            });
